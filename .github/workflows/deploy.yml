name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Org self-hosted runner 'sv-main' (labels self-hosted, Linux, X64, sv, deploy,
    # sv-2), which runs on the deployment host itself (192.168.1.91), so the token
    # goes from the org secret into the compose override without a network hop.
    runs-on: [self-hosted, Linux, X64, sv-2]
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: /root/Projects/discord-mcp
      HOST_PORT: '3001'
      REPO_URL: https://github.com/The1Studio/discord-mcp.git
    steps:
      - name: Clone or update the deploy checkout to origin/main
        # The runner is dietpi, which cannot traverse /root, so every git action runs
        # through sudo. reset --hard, not pull: this fork rebases onto upstream and
        # force-pushes main, so a merge-on-pull would conflict or drag stale commits
        # back in. A missing checkout is bootstrapped here, so the first run on this
        # box needs no manual setup.
        run: |
          set -euo pipefail
          sudo mkdir -p "$(dirname "$DEPLOY_ROOT")"
          # The existence test needs sudo too: dietpi cannot stat inside /root, so a
          # plain `-d` on an already-cloned checkout reads as false and the clone
          # below then fails with "destination path already exists".
          if ! sudo test -d "$DEPLOY_ROOT/.git"; then
            sudo git clone "$REPO_URL" "$DEPLOY_ROOT"
          fi
          sudo git -C "$DEPLOY_ROOT" fetch --prune origin
          sudo git -C "$DEPLOY_ROOT" reset --hard origin/main
          sudo git -C "$DEPLOY_ROOT" log -1 --oneline

      - name: Write docker-compose.override.yml from the org secret
        # The override is gitignored and regenerated on every deploy: the org secret
        # DISCORD_TOKEN is the single source of truth, so no plaintext token is
        # hand-maintained on the box.
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          # Studio-auth (assertion) gate, ON by default. The committed values below are the defaults; a repository
          # variable of the same name still overrides each one (set STUDIO_AUTH_ENABLED=false to switch the gate
          # off without a code change). REQUIRED stays unset (dual mode: the legacy path keeps serving), and
          # ALLOW_SUBS / STUDIO_KIDS stay optional narrowing. ALLOW_ALL_AUDIENCE_MEMBERS=true (explicit opt-in,
          # set the variable to `false` to turn it off) makes the audience claim (`discord-mcp`, pinned in code)
          # the access decision when ALLOW_SUBS is empty: a GitHub team permission on this repo in studio-auth.
          # The override is regenerated on every deploy, which is why the gate is configured here and not by
          # editing a file on the box. See docs/studio-auth.md.
          STUDIO_AUTH_ENABLED: ${{ vars.STUDIO_AUTH_ENABLED || 'true' }}
          STUDIO_AUTH_REQUIRED: ${{ vars.STUDIO_AUTH_REQUIRED }}
          STUDIO_AUTH_ISSUER: ${{ vars.STUDIO_AUTH_ISSUER || 'https://auth-api.the1studio.org' }}
          STUDIO_AUTH_JWKS_URL: ${{ vars.STUDIO_AUTH_JWKS_URL || 'https://auth-api.the1studio.org/.well-known/jwks.json' }}
          STUDIO_AUTH_ALLOW_SUBS: ${{ vars.STUDIO_AUTH_ALLOW_SUBS }}
          STUDIO_AUTH_ALLOW_ALL_AUDIENCE_MEMBERS: ${{ vars.STUDIO_AUTH_ALLOW_ALL_AUDIENCE_MEMBERS || 'true' }}
          STUDIO_AUTH_STUDIO_KIDS: ${{ vars.STUDIO_AUTH_STUDIO_KIDS }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_TOKEN:-}" ]; then
            echo "::error::org secret DISCORD_TOKEN is unset or not visible to this repository"
            exit 1
          fi
          umask 077
          # The renderer lives in the deploy checkout (the previous step just reset it to origin/main) and is
          # read through sudo because the runner cannot traverse /root. It validates every studio value against
          # its documented charset and fails this step with an ::error:: before writing anything, so a bad
          # repository variable cannot add keys to a file that docker compose runs as root. Nothing reaches
          # the real override until the whole render succeeded.
          rendered="$(mktemp)"
          trap 'rm -f "$rendered"' EXIT
          sudo cat "$DEPLOY_ROOT/.github/scripts/render-compose-override.sh" | bash -s -- "$rendered"
          sudo tee "$DEPLOY_ROOT/docker-compose.override.yml" > /dev/null < "$rendered"
          # tee keeps an existing file's mode, so an override left at 644 by an
          # earlier hand-written version would stay world-readable.
          sudo chmod 600 "$DEPLOY_ROOT/docker-compose.override.yml"

      - name: Rebuild and restart the stack
        # -f rather than `cd`: the runner is dietpi, which cannot enter /root, while
        # compose runs as root through sudo. Naming a file with -f also disables
        # compose's automatic docker-compose.override.yml discovery, so the override
        # must be passed explicitly - omitting it silently drops the token and leaves
        # the container crash-looping.
        run: |
          set -euo pipefail
          sudo docker compose -f "$DEPLOY_ROOT/docker-compose.yml" \
            -f "$DEPLOY_ROOT/docker-compose.override.yml" up -d --build
          sudo docker compose -f "$DEPLOY_ROOT/docker-compose.yml" \
            -f "$DEPLOY_ROOT/docker-compose.override.yml" ps

      - name: Smoke test - readiness endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS "http://127.0.0.1:${HOST_PORT}/healthz"; then
              echo " ✓ readiness pass"
              exit 0
            fi
            echo "attempt $i: not ready, retry in 3s"
            sleep 3
          done
          echo "✗ readiness probe failed"
          sudo docker compose -f "$DEPLOY_ROOT/docker-compose.yml" \
            -f "$DEPLOY_ROOT/docker-compose.override.yml" logs --tail 50
          exit 1

      - name: Smoke test - the secret authenticates against Discord
        # Readiness only proves the container is up with *some* long-enough token; a
        # wrong or rotated-away secret would deploy green and then 401 every tool
        # call, so exercise one REST round trip and assert the bot identity.
        #
        # Dual mode (STUDIO_AUTH_REQUIRED unset or false): the round trip goes through
        # users_get_current over loopback, as always. REQUIRED=true: the container
        # refuses every credential-less request, and this runner has none, so an
        # anonymous POST /mcp is expected to be refused (401 studio_credential_required,
        # the proof that Cloudflare Access can be narrowed) and the bot identity is
        # checked directly against Discord with the same org secret instead.
        # Same expressions as the override-render step above; the spec that runs this
        # text is packages/mcp-server/src/transports/deploy-smoke.test.ts.
        env:
          STUDIO_AUTH_REQUIRED: ${{ vars.STUDIO_AUTH_REQUIRED }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail
          base="http://127.0.0.1:${HOST_PORT}"
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          rpc='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"users_get_current","arguments":{}}}'
          mcp_call() {
            curl -sS -o "$out" -w '%{http_code}' -X POST "$base/mcp" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              -d "$rpc"
          }
          code="$(mcp_call)"
          required="${STUDIO_AUTH_REQUIRED:-}"
          if [ "$required" = "true" ]; then
            if [ "$code" != "401" ] || ! grep -q 'studio_credential_required' "$out"; then
              echo "::error::the REQUIRED gate is switched on but an anonymous POST /mcp answered ${code}, not 401 studio_credential_required: the gate is not refusing anonymous callers"
              exit 1
            fi
            echo " ✓ anonymous POST /mcp refused (401 studio_credential_required)"
            # The token goes to curl on stdin (-K -), never on a command line.
            printf 'header = "Authorization: Bot %s"\n' "${DISCORD_TOKEN#Bot }" \
              | curl -fsS -K - "${DISCORD_API_BASE:-https://discord.com/api/v10}/users/@me" -o "$out"
            grep -Eq '"bot": ?true' "$out"
            echo " ✓ bot identity confirmed directly against Discord"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::POST /mcp answered ${code}, expected 200"
            cat "$out"
            exit 1
          fi
          grep -q '"bot":true' "$out"
          if grep -q '"isError":true' "$out"; then
            echo "::error::users_get_current failed against Discord"
            cat "$out"
            exit 1
          fi
          echo " ✓ bot identity confirmed"

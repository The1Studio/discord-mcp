# Template for docker-compose.override.yml (which is gitignored):
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # then edit docker-compose.override.yml with your real token
#
# Docker Compose auto-merges docker-compose.override.yml with docker-compose.yml.
# Replace YOUR_DISCORD_BOT_TOKEN with your caller-owned bot token.
services:
  discord-mcp:
    environment:
      DISCORD_TOKEN: "Bot YOUR_DISCORD_BOT_TOKEN"
    ports:
      # Published host port; clients use http://<host>:3000/mcp.
      # Change the host side if 3000 is taken, e.g. "3001:3000".
      - "3000:3000"
